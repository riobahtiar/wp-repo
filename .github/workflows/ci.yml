name: CI

# Industry monorepo pattern:
# - Single checkout
# - npm ci only at repository root (one lockfile)
# - Turbo for JS/Vue tasks across workspaces
# - Composer still per PHP package (WordPress plugins cannot share one vendor/)

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # JS / Vue via Turborepo (all workspaces)
  # ---------------------------------------------------------------------------
  turbo:
    name: Turbo (build · typecheck · unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspaces (root only)
        run: npm ci

      - name: Turbo — typecheck, unit tests, build, budgets
        run: npx turbo run typecheck test:unit build check:bundle-size

  # ---------------------------------------------------------------------------
  # PHP quality for wp-bizwit
  # ---------------------------------------------------------------------------
  php-bizwit:
    name: PHP (wp-bizwit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/wp-bizwit
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          tools: cs2pr
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v5
        with:
          path: |
            plugins/wp-bizwit/vendor
            plugins/wp-bizwit/vendor-prefixed
          key: php-bizwit-${{ runner.os }}-${{ hashFiles('plugins/wp-bizwit/composer.lock', 'plugins/wp-bizwit/composer.json') }}
          restore-keys: |
            php-bizwit-${{ runner.os }}-

      - name: Composer install
        run: |
          composer validate --strict
          mkdir -p vendor-prefixed bin
          composer install --prefer-dist --no-interaction --no-progress

      - name: PHPStan
        run: composer run phpstan:ci

      - name: PHPCS
        id: phpcs
        continue-on-error: true
        run: composer run phpcs:ci

      - name: Show PHPCS results in PR
        if: ${{ always() && steps.phpcs.outcome == 'failure' }}
        run: cs2pr ./phpcs-report.xml --graceful-warnings
        working-directory: plugins/wp-bizwit

  # ---------------------------------------------------------------------------
  # Application tests (wp-env) for wp-bizwit
  # ---------------------------------------------------------------------------
  app-bizwit:
    name: PHPUnit (wp-bizwit / wp-env)
    runs-on: ubuntu-latest
    needs: [turbo, php-bizwit]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspaces (root only)
        run: npm ci

      - name: Cache Composer
        uses: actions/cache@v5
        with:
          path: |
            plugins/wp-bizwit/vendor
            plugins/wp-bizwit/vendor-prefixed
          key: php-bizwit-${{ runner.os }}-${{ hashFiles('plugins/wp-bizwit/composer.lock', 'plugins/wp-bizwit/composer.json') }}
          restore-keys: |
            php-bizwit-${{ runner.os }}-

      - name: Composer install
        working-directory: plugins/wp-bizwit
        run: |
          mkdir -p vendor-prefixed bin
          composer install --prefer-dist --no-interaction --no-progress

      - name: Write Composer auth for test dependencies
        if: env.COMPOSER_AUTH != ''
        working-directory: plugins/wp-bizwit
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
        run: |
          cat << 'EOF' > tests/auth.json
          $COMPOSER_AUTH
          EOF

      # Always invoke workspace scripts from the monorepo root (-w), never via a
      # nested package-lock or package-local node_modules.
      - name: Start wp-env
        run: npm run -w wp-bizwit env:start

      - name: Run application tests
        run: npm run -w wp-bizwit test:php

      - name: Stop wp-env
        if: always()
        run: npm run -w wp-bizwit env:stop
